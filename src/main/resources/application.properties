spring.application.name=estoque-spring-api
server.port=8080
spring.profiles.active=persistente
spring.datasource.url=${ESTOQUE_DB_URL:jdbc:h2:file:./dados/estoque}
spring.datasource.username=${ESTOQUE_DB_USER:sa}
spring.datasource.password=${ESTOQUE_DB_PASSWORD:}
spring.h2.console.enabled=false
spring.jackson.deserialization.fail-on-unknown-properties=true
server.error.include-stacktrace=never
